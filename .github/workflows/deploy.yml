name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            plcafe-admin/package-lock.json
            plcafe-client/package-lock.json

      - name: Install Admin Dependencies 📦
        working-directory: ./plcafe-admin
        run: npm install --legacy-peer-deps

      - name: Build Admin App 🏗️
        working-directory: ./plcafe-admin
        env:
          CI: false
        run: npm run build

      - name: Install Client Dependencies 📦
        working-directory: ./plcafe-client
        run: npm install --legacy-peer-deps

      - name: Build Client App 🏗️
        working-directory: ./plcafe-client
        env:
          CI: false
        run: npx expo export --platform web

      - name: Prepare Deployment Root 📁
        run: |
          mkdir -p deploy/client
          mkdir -p deploy/admin
          [ -f .nojekyll ] && cp .nojekyll deploy/ || touch deploy/.nojekyll
          [ -f index.html ] && cp index.html deploy/ || echo "Root index.html missing"

      - name: Copy App Assets 🚚
        run: |
          if [ -d plcafe-client/dist ]; then
            cp -rf plcafe-client/dist/* deploy/client/
          else
            echo "::warning::Client dist not found"
          fi
          
          if [ -d plcafe-admin/out ]; then
            cp -rf plcafe-admin/out/* deploy/admin/
          else
            echo "::warning::Admin out not found"
          fi

      - name: Verify Final Structure 🔍
        run: ls -R deploy

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
          clean: true
