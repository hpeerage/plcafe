name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            plcafe-admin/package-lock.json
            plcafe-client/package-lock.json

      - name: Install Admin 📦
        working-directory: ./plcafe-admin
        run: npm install --legacy-peer-deps

      - name: Build Admin 🏗️
        working-directory: ./plcafe-admin
        env:
          CI: false
        run: npm run build

      - name: Install Client 📦
        working-directory: ./plcafe-client
        run: npm install --legacy-peer-deps

      - name: Build Client 🏗️
        working-directory: ./plcafe-client
        env:
          CI: false
        run: npx expo export --platform web

      - name: Prepare Deployment 📂
        run: |
          mkdir -p deploy/client
          mkdir -p deploy/admin
          
          # Root files
          [ -f .nojekyll ] && cp .nojekyll deploy/ || touch deploy/.nojekyll
          [ -f index.html ] && cp index.html deploy/ || echo "index.html missing"
          
          # Assets
          [ -d plcafe-client/dist ] && cp -rf plcafe-client/dist/* deploy/client/ || echo "no client dist"
          [ -d plcafe-admin/out ] && cp -rf plcafe-admin/out/* deploy/admin/ || echo "no admin out"
          
          # List
          ls -R deploy

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
          clean: true
