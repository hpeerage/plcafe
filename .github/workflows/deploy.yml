name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            plcafe-admin/package-lock.json
            plcafe-client/package-lock.json

      - name: Install & Build Admin 🏗️
        working-directory: ./plcafe-admin
        run: |
          npm ci
          npm run build

      - name: Install & Build Client 🏗️
        working-directory: ./plcafe-client
        run: |
          npm ci
          npx expo export --platform web

      - name: Prepare Deployment 📂
        run: |
          mkdir -p deploy/client
          mkdir -p deploy/admin
          
          # 1. Root files (.nojekyll, index.html)
          cp .nojekyll deploy/
          cp index.html deploy/
          
          # 2. Client App (/client/)
          cp -r plcafe-client/dist/* deploy/client/
          
          # 3. Admin Dashboard (/admin/)
          cp -r plcafe-admin/out/* deploy/admin/
          
          # 4. Final Structure Verification
          echo "### DEPLOY DIRECTORY STRUCTURE ###"
          ls -R deploy
          
          echo "### CHECKING CLIENT INDEX.HTML PATHS ###"
          cat deploy/client/index.html | head -n 50
          
          echo "### CHECKING ADMIN INDEX.HTML PATHS ###"
          cat deploy/admin/index.html | head -n 50

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
          clean: true
