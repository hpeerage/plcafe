name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            plcafe-admin/package-lock.json
            plcafe-client/package-lock.json

      - name: Install & Build Admin 🏗️
        working-directory: ./plcafe-admin
        env:
          CI: false
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install & Build Client 🏗️
        working-directory: ./plcafe-client
        env:
          CI: false
        run: |
          npm install --legacy-peer-deps
          npx expo export --platform web

      - name: Prepare Deployment 📂
        run: |
          mkdir -p deploy/client
          mkdir -p deploy/admin
          
          # 1. Root files
          [ -f .nojekyll ] && cp .nojekyll deploy/ || touch deploy/.nojekyll
          [ -f index.html ] && cp index.html deploy/
          
          # 2. Copy Build Results
          [ -d plcafe-client/dist ] && cp -rf plcafe-client/dist/* deploy/client/ || echo "Client dist missing"
          [ -d plcafe-admin/out ] && cp -rf plcafe-admin/out/* deploy/admin/ || echo "Admin out missing"
          
          # 3. Simple list
          ls -R deploy

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
          clean: true
