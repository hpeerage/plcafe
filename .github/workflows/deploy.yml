name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            plcafe-admin/package-lock.json
            plcafe-client/package-lock.json

      - name: Install Admin Dependencies 📦
        working-directory: ./plcafe-admin
        run: npm ci

      - name: Build Admin 🏗️
        working-directory: ./plcafe-admin
        run: npm run build

      - name: Install Client Dependencies 📦
        working-directory: ./plcafe-client
        run: npm ci

      - name: Build Client 🏗️
        working-directory: ./plcafe-client
        run: npx expo export --platform web

      - name: Prepare Deployment 📂
        run:           mkdir -p deploy
                  cp -r plcafe-client/dist/* deploy/                            mkdir -p deploy/admin
                                      cp -r plcafe-admin/out/* deploy/admin/
                                                touch deploy/.nojekyll
                                                    - name: Deploy to GitHub Pages
                                                              uses: JamesIves/github-pages-deploy-action@v4
                                                                      with:
                                                                                folder: deploy
                                                                                          branch: gh-pages
          mkdir -p deplo          cp -r plcafe-client/dist/* deploy
                    mkdir -p deploy/admin
                              cp -r plcafe-admin/out/* deploy/admin/
                                        touch deploy/.nojekyll

                                              - name: Deploy to GitHub Pages
                                                      uses: JamesIves/github-pages-deploy-action@v4
                                                              with:
                                                                        folder: deploy
                                                                                  branch: gh-pages
          cp index.html deploy/
          cp -r plcafe-client/dist deploy/client

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
          clean: true
