name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            plcafe-admin/package-lock.json
            plcafe-client/package-lock.json

      - name: Install & Build Admin 🏗️
        working-directory: ./plcafe-admin
        run: |
          npm install
          npm run build

      - name: Install & Build Client 🏗️
        working-directory: ./plcafe-client
        run: |
          npm install
          npx expo export --platform web

      - name: Prepare Deployment 📂
        run: |
          mkdir -p deploy/client
          mkdir -p deploy/admin
          
          # 1. Root files (.nojekyll, index.html)
          [ -f .nojekyll ] && cp .nojekyll deploy/ || touch deploy/.nojekyll
          [ -f index.html ] && cp index.html deploy/ || echo "index.html missing"
          
          # 2. Client App (/client/)
          if [ -d plcafe-client/dist ]; then
            cp -rf plcafe-client/dist/* deploy/client/
          else
            echo "plcafe-client/dist not found"
          fi
          
          # 3. Admin Dashboard (/admin/)
          if [ -d plcafe-admin/out ]; then
            cp -rf plcafe-admin/out/* deploy/admin/
          else
            echo "plcafe-admin/out not found"
          fi
          
          # 4. Final Structure Verification
          echo "### DEPLOY DIRECTORY STRUCTURE ###"
          ls -R deploy
          
          echo "### CHECKING CLIENT INDEX.HTML PATHS ###"
          [ -f deploy/client/index.html ] && (cat deploy/client/index.html | head -n 50) || echo "client index.html missing"
          
          echo "### CHECKING ADMIN INDEX.HTML PATHS ###"
          [ -f deploy/admin/index.html ] && (cat deploy/admin/index.html | head -n 50) || echo "admin index.html missing"

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
          clean: true
